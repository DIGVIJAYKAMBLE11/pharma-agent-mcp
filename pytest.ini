[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    groq: calls the real Groq LLM (needs GROQ_API_KEY; uses free-tier tokens)
    live: calls the real public data APIs (openFDA, ClinicalTrials.gov, PubMed)
filterwarnings =
    ignore::DeprecationWarning
