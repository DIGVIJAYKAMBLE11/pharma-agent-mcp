name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if a secret was committed
        run: |
          if git grep -nE 'gsk_[A-Za-z0-9]{20,}' -- . ':!.github'; then
            echo "A Groq key is committed. Remove it and rotate the key."; exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Every test is real: Groq for the LLM and the public APIs for data.
      # Add the key once: GitHub repo -> Settings -> Secrets and variables -> Actions -> GROQ_API_KEY
      - name: Tests (real Groq + live APIs)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: pytest -q

      - name: Docker image builds
        run: docker build -t pharma-agent:ci .
